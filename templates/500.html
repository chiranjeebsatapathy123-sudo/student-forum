{% extends 'studentforum/base.html' %}
{% block title %}Server Error - Student Knowledge Hub{% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center text-center py-5" style="min-height: 60vh;">
    <div class="mb-4">
        <i class="fas fa-meteor fa-5x text-danger opacity-50"></i>
    </div>
    <h1 class="display-1 fw-bold text-gradient mb-3" style="background: linear-gradient(135deg, var(--danger), #fb7185); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">500</h1>
    <h3 class="fw-bold mb-3">Something went wrong.</h3>
    <p class="text-muted mb-5" style="max-width: 500px;">Our systems encountered an unexpected error. Our engineering team has been notified. Please try again later.</p>
    <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 shadow"><i class="fas fa-home me-2"></i>Return Home</a>
</div>
{% endblock %}
