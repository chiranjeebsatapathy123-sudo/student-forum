{% extends 'studentforum/base.html' %}
{% block title %}Too Many Requests - Student Knowledge Hub{% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center text-center py-5" style="min-height: 60vh;">
    <div class="mb-4">
        <i class="fas fa-tachometer-alt fa-5x text-warning opacity-75"></i>
    </div>
    <h1 class="display-1 fw-bold text-gradient mb-3" style="background: linear-gradient(135deg, var(--warning), var(--danger)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">429</h1>
    <h3 class="fw-bold mb-3">Whoa, slow down!</h3>
    <p class="text-muted mb-5" style="max-width: 500px;">You're moving too fast for us to keep up. Please wait a moment before trying again.</p>
    <div class="d-flex gap-3">
        <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 shadow"><i class="fas fa-home me-2"></i>Back to Explore</a>
        <a href="javascript:location.reload()" class="btn btn-outline-secondary rounded-pill px-4"><i class="fas fa-sync-alt me-2"></i>Try Again</a>
    </div>
</div>
{% endblock %}
