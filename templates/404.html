{% extends 'studentforum/base.html' %}
{% block title %}Not Found - Student Knowledge Hub{% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center text-center py-5" style="min-height: 60vh;">
    <div class="mb-4">
        <i class="fas fa-space-shuttle fa-5x text-primary opacity-50" style="transform: rotate(-45deg);"></i>
    </div>
    <h1 class="display-1 fw-bold text-gradient mb-3" style="background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
    <h3 class="fw-bold mb-3">Lost in the knowledge universe.</h3>
    <p class="text-muted mb-5" style="max-width: 500px;">The discussion or page you're looking for doesn't exist. It might have been moved or deleted.</p>
    <div class="d-flex gap-3">
        <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 shadow"><i class="fas fa-home me-2"></i>Back to Explore</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">Go Back</a>
    </div>
</div>
{% endblock %}
