version: '3.8'

services:
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 studentforum.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-student-forum-secret-key-change-in-production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
