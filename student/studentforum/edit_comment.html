{% extends 'studentforum/base.html' %}
{% block title %}Edit Comment - Student Forum{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark py-3">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-edit me-2"></i>Edit Comment</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small mb-3">
                        Post: <strong>{{ comment.post.title }}</strong>
                    </p>
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">{{ form.comment_text }}</div>
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-warning px-4">
                                <i class="fas fa-save me-2"></i>Update Comment
                            </button>
                            <a href="{% url 'post_detail' comment.post.pk %}" class="btn btn-outline-secondary px-4">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
