{% extends 'studentforum/base.html' %}
{% block title %}{% if category %}Edit{% else %}Create{% endif %} Category{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="fas fa-tag me-2"></i>{% if category %}Edit{% else %}Create{% endif %} Category
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category Name *</label>
                            {{ form.name }}
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Description</label>
                            {{ form.description }}
                        </div>
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fas fa-save me-2"></i>Save Category
                            </button>
                            <a href="{% url 'category_list' %}" class="btn btn-outline-secondary px-4">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
