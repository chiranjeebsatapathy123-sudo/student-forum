{% extends 'studentforum/base.html' %}
{% block title %}Confirm Delete - Student Forum{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white text-center py-3">
                    <i class="fas fa-exclamation-triangle fa-2x mb-2"></i>
                    <h5 class="mb-0 fw-bold">Confirm Delete</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="text-muted mb-1">You are about to delete this {{ type }}:</p>
                    <p class="fw-bold fs-5 mb-4">"{{ object }}"</p>
                    <p class="text-danger small mb-4">
                        <i class="fas fa-exclamation-circle me-1"></i>This action cannot be undone.
                    </p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center">
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="fas fa-trash me-2"></i>Yes, Delete
                            </button>
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
